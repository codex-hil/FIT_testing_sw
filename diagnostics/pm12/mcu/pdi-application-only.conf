# Explicit application-only view; avoids AVRDUDE6.3 trailing-FF trimming.
# JTAG3 PDI uses MTYPE_FLASH for this alias; page erase is APP_PAGE.
# No access beyond application0x00000..0x1ffff.
part parent "x128a3u"
 id = "pm12_full_app";
 desc = "PM12 ATxmega128A3U bounded application view";
 memory "app_full"
  size = 0x20000;
  offset = 0x800000;
  page_size = 0x200;
  readsize = 0x100;
 ;
;
